adapters:
  hatexplain:
    post_id_field: "post_id"
    text_field: "post_tokens"
    label_field: "annotators"
    has_user_id: false
    has_timestamp: false
    has_interactions: false
    label_mapping:
      normal: "NORMAL"
      hatespeech: "HATE"
      offensive: "OFFENSIVE"
  hasoc:
    post_id_field: "text_id"
    text_field: "text"
    label_field: "task_1"
    subtask_field: "task_2"
    has_user_id: false
    has_timestamp: false
    has_interactions: false
    label_mapping:
      NOT: "NORMAL"
      HOF: "OFFENSIVE"
      HATE: "HATE"
      OFFN: "OFFENSIVE"
      PRFN: "OFFENSIVE"